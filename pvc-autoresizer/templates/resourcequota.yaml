{{- if .Values.resourceQuota.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "pvc-autoresizer.fullname" . }}-critical-pods
  labels:
    {{- include "pvc-autoresizer.labels" . | nindent 4 }}
spec:
  hard:
    pods: "100"
  scopeSelector:
    matchExpressions:
      - operator: In
        scopeName: PriorityClass
        values: ["system-node-critical", "system-cluster-critical"]
{{- end }}
