kubelet-volume-stats-exporter:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: prometheus

  config:
    metricsPort: 9118

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9118"
    prometheus.io/path: "/metrics"

  service:
    port: 9118
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9118"
      prometheus.io/path: "/metrics"
