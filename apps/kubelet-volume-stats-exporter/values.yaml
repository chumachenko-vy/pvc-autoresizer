kubelet-volume-stats-exporter:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: prometheus

  priorityClassName: ""

  args:
    - --kubelet-endpoint=https://127.0.0.1:10250
    - --metrics-port=9118
    - --scrape-interval=30s
    - --token-path=/var/run/secrets/kubernetes.io/serviceaccount/token
    - --insecure-skip-tls-verify=true

  containerPort: 9118

  service:
    port: 9118
    targetPort: 9118
