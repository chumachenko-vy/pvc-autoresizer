apiVersion: batch/v1
kind: Job
metadata:
  name: patch-exporter-priority
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: patch-exporter
      restartPolicy: Never
      containers:
        - name: patch
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              kubectl patch daemonset kubelet-volume-stats-exporter -n {{ .Release.Namespace }} --type=json -p='[{"op":"remove","path":"/spec/template/spec/priorityClassName"}]' 2>/dev/null || echo "Already patched"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patch-exporter
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patch-exporter
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patch-exporter
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
subjects:
  - kind: ServiceAccount
    name: patch-exporter
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: patch-exporter
  apiGroup: rbac.authorization.k8s.io
