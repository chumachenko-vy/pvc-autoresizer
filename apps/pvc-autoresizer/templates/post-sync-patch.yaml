apiVersion: batch/v1
kind: Job
metadata:
  name: pvc-autoresizer-patch-args
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: pvc-autoresizer-patch
      restartPolicy: Never
      containers:
        - name: patch
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              # Check if --no-annotation-check already exists
              ARGS=$(kubectl get deploy pvc-autoresizer-controller -n {{ .Release.Namespace }} -o jsonpath='{.spec.template.spec.containers[0].args}')
              if echo "$ARGS" | grep -q "no-annotation-check"; then
                echo "Already patched"
                exit 0
              fi
              kubectl patch deploy pvc-autoresizer-controller -n {{ .Release.Namespace }} --type=json -p='[
                {"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--no-annotation-check"}
              ]'
              echo "Patched successfully"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pvc-autoresizer-patch
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pvc-autoresizer-patch
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pvc-autoresizer-patch
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
subjects:
  - kind: ServiceAccount
    name: pvc-autoresizer-patch
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: pvc-autoresizer-patch
  apiGroup: rbac.authorization.k8s.io
