apiVersion: v2
name: pvc-autoresizer
description: PVC auto-resizer with kubelet volume stats exporter, annotator cronjob and alerts
type: application
version: 1.0.0
appVersion: "1.0.0"
dependencies:
  - name: pvc-autoresizer
    version: "0.16.2"
    repository: "https://topolvm.github.io/pvc-autoresizer/"
    alias: autoresizer
  - name: kubelet-volume-stats-exporter
    version: "1.1.0"
    repository: "https://vbeaucha.github.io/helm-charts"
    alias: exporter
